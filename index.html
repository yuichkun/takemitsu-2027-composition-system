<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Score Preview</title>
    <link rel="stylesheet" href="/src/preview/style.css" />
  </head>
  <body>
    <aside id="sidebar">
      <h1>Score Preview</h1>
      <nav id="scores"></nav>
      <p class="hint">examples/ と scores/ の JSON を表示する。ファイルを保存すると描き直す。</p>
    </aside>
    <main>
      <header id="toolbar">
        <div class="title"><span id="title">楽譜を選ぶ</span></div>
        <div class="range">
          <label for="from">小節</label>
          <input id="from" type="number" min="1" value="1" />
          <span>–</span>
          <input id="to" type="number" min="1" value="1" />
          <button id="all" type="button" title="全小節">全体</button>
        </div>
        <button id="render" type="button" class="primary">レンダ</button>
        <div id="status" class="status"></div>
        <div class="transport">
          <button id="play" type="button" class="round" aria-label="再生" disabled>▶</button>
          <span id="time" class="time">0:00 / 0:00</span>
          <input
            id="seek"
            type="range"
            min="0"
            max="1"
            step="0.01"
            value="0"
            aria-label="位置"
            disabled
          />
        </div>
      </header>
      <section id="messages" hidden></section>
      <div id="score" class="score"></div>
      <section id="mixer" aria-label="ミキサー">
        <div class="mixer-head">
          <span>ミキサー</span>
          <span id="mixer-mode" class="mixer-mode"></span>
          <button id="mixer-reset" type="button">すべて 0 dB に戻す</button>
          <button id="mixer-toggle" type="button" aria-expanded="true">たたむ</button>
        </div>
        <div id="strips" class="strips"></div>
      </section>
    </main>
    <script type="module" src="/src/preview/main.ts"></script>
  </body>
</html>
